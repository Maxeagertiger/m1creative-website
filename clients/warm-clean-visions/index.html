<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prisma — A Network of Visual Artists & Filmmakers</title>
    <meta name="description" content="Prisma is a worldwide network of visual artists, filmmakers and storytellers bound by passion and unique perspectives." />
    <script type="module" crossorigin src="./assets/main-BeDxh-wd.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-Z5sLIz9T.css">
  </head>
  <body class="bg-black text-white">
    <div id="root"></div>

    <!-- Navigation Patch Script to link to the new subpages and localize text/socials -->
    <script>
      (function() {
        function patchNavLinks() {
          const links = document.querySelectorAll('a, button');
          links.forEach(link => {
            const text = link.textContent.trim().toLowerCase();
            if (text === 'our story') {
              link.setAttribute('href', 'story.html');
            } else if (text === 'collective') {
              link.setAttribute('href', 'collective.html');
            } else if (text === 'workshops') {
              link.setAttribute('href', 'workshops.html');
            } else if (text === 'programs') {
              link.setAttribute('href', 'programs.html');
            } else if (text === 'inquiries') {
              link.setAttribute('href', 'inquiries.html');
            } else if (text.includes('join the lab')) {
              if (link.tagName === 'A') {
                link.setAttribute('href', 'inquiries.html?type=join');
              }
            } else if (text.includes('start a project')) {
              if (link.tagName === 'A') {
                link.setAttribute('href', 'inquiries.html?type=project');
              }
            }
          });

          // Walk the DOM and replace Berlin/Paris in text nodes
          function walkAndReplace(node) {
            if (node.nodeType === Node.TEXT_NODE) {
              node.nodeValue = node.nodeValue
                .replace(/Berlin-based/g, 'Johannesburg-based')
                .replace(/in Paris/g, 'in Cape Town')
                .replace(/Berlin/g, 'Johannesburg')
                .replace(/Paris/g, 'Cape Town');
            } else if (node.nodeType === Node.ELEMENT_NODE) {
              // Exclude script and style tags
              if (node.tagName !== 'SCRIPT' && node.tagName !== 'STYLE') {
                for (let child of node.childNodes) {
                  walkAndReplace(child);
                }
              }
            }
          }
          walkAndReplace(document.body);

          // Hide social links dynamically
          const footerLinks = document.querySelectorAll('footer a, footer span, a');
          footerLinks.forEach(link => {
            const txt = link.textContent.trim().toLowerCase();
            if (txt === 'instagram' || txt === 'vimeo') {
              link.style.display = 'none';
            }
          });
        }

        // Intercept clicks (including buttons) to redirect to the new pages
        document.addEventListener('click', function(e) {
          const target = e.target.closest('a, button');
          if (!target) return;
          
          const text = target.textContent.trim().toLowerCase();
          if (text === 'our story') {
            e.preventDefault();
            window.location.href = 'story.html';
          } else if (text === 'collective') {
            e.preventDefault();
            window.location.href = 'collective.html';
          } else if (text === 'workshops') {
            e.preventDefault();
            window.location.href = 'workshops.html';
          } else if (text === 'programs') {
            e.preventDefault();
            window.location.href = 'programs.html';
          } else if (text === 'inquiries') {
            e.preventDefault();
            window.location.href = 'inquiries.html';
          } else if (text.includes('join the lab')) {
            e.preventDefault();
            window.location.href = 'inquiries.html?type=join';
          } else if (text.includes('start a project')) {
            e.preventDefault();
            window.location.href = 'inquiries.html?type=project';
          }
        }, true); // Use capturing phase to run before React intercepts click

        // Observe DOM mutations to patch dynamic React elements as they render
        const observer = new MutationObserver(patchNavLinks);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        
        // Initial run
        window.addEventListener('load', patchNavLinks);
      })();
    </script>
  </body>
</html>
